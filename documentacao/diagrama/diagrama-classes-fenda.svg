<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1530" viewBox="0 0 2400 1530" role="img" aria-labelledby="title description">
  <title id="title">Diagrama de classes conceitual da plataforma A Fenda</title>
  <desc id="description">Diagrama UML com as classes Usuario, Publicacao, Comentario, Reacao, Notificacao, Comunidade, ParticipacaoComunidade, Evento, RespostaEvento e Anuncio, mostrando atributos, operacoes e associacoes principais.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; }
      .heading { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #52647a; }
      .box { fill: #ffffff; stroke: #365a7a; stroke-width: 2; }
      .class-name { font-size: 22px; font-weight: 700; text-anchor: middle; }
      .stereotype { font-size: 14px; fill: #60758b; text-anchor: middle; }
      .member { font-size: 16px; }
      .divider { stroke: #91a5b9; stroke-width: 1.5; }
      .association { fill: none; stroke: #334e68; stroke-width: 2; }
      .association-label { font-size: 15px; fill: #334e68; }
      .multiplicity { font-size: 15px; font-weight: 700; fill: #243b53; }
      .note { fill: #f4f7fa; stroke: #829ab1; stroke-width: 1.5; }
      .note-text { font-size: 16px; fill: #334e68; }
    </style>
    </defs>

  <rect width="2400" height="1530" fill="#ffffff"/>
  <text x="70" y="62" class="heading">Diagrama de classes — A Fenda</text>
  <text x="70" y="96" class="subtitle">Modelo conceitual do domínio · UML · operações representam responsabilidades do sistema</text>

