  <text x="1268" y="373" class="multiplicity">0..1 pai</text>
  <text x="1093" y="425" class="multiplicity">0..* respostas</text>

  <path class="association" d="M840 380 V510 H1925 V400"/>
  <text x="848" y="405" class="multiplicity">0..*</text>
  <text x="1890" y="425" class="multiplicity">0..1</text>
  <text x="1430" y="503" class="association-label">notificação pode referenciar publicação</text>

  <path class="association" d="M245 400 V535 H1085 V400"/>
  <text x="253" y="425" class="multiplicity">0..*</text>
