  <g>
    <rect class="box" x="1330" y="810" width="350" height="280"/>
    <text class="class-name" x="1505" y="844">RespostaEvento</text>
    <text class="stereotype" x="1505" y="866">«evento_respostas»</text>
    <line class="divider" x1="1330" y1="878" x2="1680" y2="878"/>
    <text class="member" x="1348" y="904">- usuarioId: int</text>
    <text class="member" x="1348" y="928">- eventoId: int</text>
    <text class="member" x="1348" y="952">- resposta: String</text>
    <text class="member" x="1348" y="976">- dataResposta: DateTime</text>
    <line class="divider" x1="1330" y1="988" x2="1680" y2="988"/>
    <text class="member" x="1348" y="1015">+ registrar(): void</text>
    <text class="member" x="1348" y="1041">+ atualizar(): void</text>
  </g>

  <g>
    <rect class="box" x="1750" y="810" width="350" height="280"/>
    <text class="class-name" x="1925" y="844">Anuncio</text>
    <text class="stereotype" x="1925" y="866">«anuncios · módulo futuro»</text>
    <line class="divider" x1="1750" y1="878" x2="2100" y2="878"/>
    <text class="member" x="1768" y="904">- id: int</text>
    <text class="member" x="1768" y="928">- titulo: String</text>
    <text class="member" x="1768" y="952">- descricao: String</text>
    <text class="member" x="1768" y="976">- preco: Decimal</text>
    <line class="divider" x1="1750" y1="988" x2="2100" y2="988"/>
    <text class="member" x="1768" y="1015">Fluxo funcional ainda não</text>
    <text class="member" x="1768" y="1041">disponível ao usuário</text>
  </g>

  <rect class="note" x="70" y="1240" width="2030" height="145" rx="4"/>
  <text class="note-text" x="95" y="1276">Observações do modelo</text>
  <text class="note-text" x="95" y="1310">• O perfil é representado como parte de Usuario; não aparece como classe separada no modelo de dados consultado.</text>
  <text class="note-text" x="95" y="1342">• Achados e perdidos são representados por publicações categorizadas; a associação comunidade–evento é omitida porque não há FK declarada no DER consultado.</text>
  <text class="note-text" x="95" y="1374">• Os nomes entre « » indicam as tabelas correspondentes. Anuncio aparece apenas como estrutura do banco: o marketplace ainda não oferece fluxo funcional ao usuário.</text>

  <text class="subtitle" x="70" y="1450">Fonte: elaborado pelo autor com base no modelo de dados e nas funcionalidades identificadas no projeto (2026).</text>
</svg>
