    <text class="class-name" x="665" y="844">ParticipacaoComunidade</text>
    <text class="stereotype" x="665" y="866">«comunidade_membros»</text>
    <line class="divider" x1="490" y1="878" x2="840" y2="878"/>
    <text class="member" x="508" y="904">- usuarioId: int</text>
    <text class="member" x="508" y="928">- comunidadeId: int</text>
    <line class="divider" x1="490" y1="988" x2="840" y2="988"/>
    <text class="member" x="508" y="1015">+ ingressar(): void</text>
    <text class="member" x="508" y="1041">+ sair(): void</text>
  </g>

  <g>
    <rect class="box" x="910" y="810" width="350" height="280"/>
    <text class="class-name" x="1085" y="844">Evento</text>
    <text class="stereotype" x="1085" y="866">«eventos»</text>
    <line class="divider" x1="910" y1="878" x2="1260" y2="878"/>
    <text class="member" x="928" y="904">- id: int</text>
    <text class="member" x="928" y="928">- nome: String</text>
    <text class="member" x="928" y="952">- dataEvento: DateTime</text>
    <text class="member" x="928" y="976">- local: String</text>
    <line class="divider" x1="910" y1="988" x2="1260" y2="988"/>
    <text class="member" x="928" y="1015">+ confirmarPresenca(): void</text>
    <text class="member" x="928" y="1041">+ comentar(): void</text>
