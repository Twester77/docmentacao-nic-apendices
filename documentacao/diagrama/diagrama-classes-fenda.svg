    <text class="member" x="1768" y="234">- id: int</text>
    <text class="member" x="1768" y="258">- tipo: String</text>
    <text class="member" x="1768" y="282">- mensagem: String</text>
    <text class="member" x="1768" y="306">- lida: Boolean</text>
    <line class="divider" x1="1750" y1="318" x2="2100" y2="318"/>
    <text class="member" x="1768" y="345">+ marcarComoLida(): void</text>
    <text class="member" x="1768" y="371">+ abrirDestino(): void</text>
  </g>

  <!-- Bottom row -->
  <g>
    <rect class="box" x="70" y="810" width="350" height="280"/>
    <text class="class-name" x="245" y="844">Comunidade</text>
    <text class="stereotype" x="245" y="866">«comunidades»</text>
    <line class="divider" x1="70" y1="878" x2="420" y2="878"/>
