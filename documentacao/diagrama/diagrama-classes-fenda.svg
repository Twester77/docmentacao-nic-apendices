  <!-- Top row -->
  <g>
    <rect class="box" x="70" y="140" width="350" height="260"/>
    <text class="class-name" x="245" y="174">Usuario</text>
    <text class="stereotype" x="245" y="196">«usuarios»</text>
    <line class="divider" x1="70" y1="208" x2="420" y2="208"/>
    <text class="member" x="88" y="234">- id: int</text>
    <text class="member" x="88" y="258">- nome: String</text>
    <text class="member" x="88" y="282">- email: String</text>
    <text class="member" x="88" y="306">- foto: String [0..1]</text>
    <line class="divider" x1="70" y1="318" x2="420" y2="318"/>
    <text class="member" x="88" y="345">+ publicar(): Publicacao</text>
    <text class="member" x="88" y="371">+ participar(): void</text>
  </g>

  <g>
    <rect class="box" x="490" y="140" width="350" height="260"/>
    <text class="class-name" x="665" y="174">Publicacao</text>
    <text class="stereotype" x="665" y="196">«mensagens»</text>
    <line class="divider" x1="490" y1="208" x2="840" y2="208"/>
    <text class="member" x="508" y="234">- id: int</text>
    <text class="member" x="508" y="258">- mensagem: String</text>
    <text class="member" x="508" y="282">- categoria: String</text>
    <text class="member" x="508" y="306">- dataPost: DateTime</text>
    <line class="divider" x1="490" y1="318" x2="840" y2="318"/>
    <text class="member" x="508" y="345">+ comentar(): Comentario</text>
    <text class="member" x="508" y="371">+ reagir(tipo): Reacao</text>
  </g>

  <g>
    <rect class="box" x="910" y="140" width="350" height="260"/>
    <text class="class-name" x="1085" y="174">Comentario</text>
    <text class="stereotype" x="1085" y="196">«comentarios»</text>
    <line class="divider" x1="910" y1="208" x2="1260" y2="208"/>
    <text class="member" x="928" y="234">- id: int</text>
    <text class="member" x="928" y="258">- texto: String</text>
    <text class="member" x="928" y="282">- dataComentario: DateTime</text>
    <text class="member" x="928" y="306">- status: String</text>
    <line class="divider" x1="910" y1="318" x2="1260" y2="318"/>
    <text class="member" x="928" y="345">+ responder(): Comentario</text>
    <text class="member" x="928" y="371">+ editar(): void</text>
  </g>

  <g>
    <rect class="box" x="1330" y="140" width="350" height="260"/>
    <text class="class-name" x="1505" y="174">Reacao</text>
    <text class="stereotype" x="1505" y="196">«curtidas»</text>
    <line class="divider" x1="1330" y1="208" x2="1680" y2="208"/>
    <text class="member" x="1348" y="234">- id: int</text>
    <text class="member" x="1348" y="258">- tipo: String</text>
    <text class="member" x="1348" y="282">- dataReacao: DateTime</text>
    <line class="divider" x1="1330" y1="318" x2="1680" y2="318"/>
    <text class="member" x="1348" y="345">+ registrar(): void</text>
    <text class="member" x="1348" y="371">+ remover(): void</text>
  </g>

  <g>
