<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo lógico da arquitetura e hospedagem da plataforma A Fenda</title>
  <desc id="desc">O navegador comunica-se com a aplicação PHP. A aplicação consulta o banco TiDB compatível com MySQL e, quando necessário, serviços externos de autenticação, armazenamento, e-mail e proteção contra bots. A configuração de hospedagem no repositório inclui Vercel e Docker com Apache, sem afirmar que todos os serviços estejam ativos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4faff"/>
      <stop offset="1" stop-color="#eef5fb"/>
    </linearGradient>
    <linearGradient id="app" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9f2ff"/>
      <stop offset="1" stop-color="#e9e2ff"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f7ed"/>
      <stop offset="1" stop-color="#d5eeff"/>
    </linearGradient>
    <linearGradient id="services" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0d9"/>
      <stop offset="1" stop-color="#ffe1ea"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 z" fill="#40556d"/>
    </marker>
    <marker id="arrowStart" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M11,1 L1,6 L11,11 z" fill="#40556d"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#263d55" flood-opacity=".11"/>
    </filter>
    <style>
      .title { font: 700 38px system-ui, sans-serif; fill: #172b45; }
      .subtitle { font: 400 20px system-ui, sans-serif; fill: #4c6178; }
      .heading { font: 700 25px system-ui, sans-serif; fill: #19314d; }
      .body { font: 400 20px system-ui, sans-serif; fill: #263d55; }
      .small { font: 400 17px system-ui, sans-serif; fill: #415970; }
      .label { font: 650 16px system-ui, sans-serif; fill: #40556d; }
      .node { stroke: #91a9c0; stroke-width: 2; }
      .connector { fill: none; stroke: #40556d; stroke-width: 3; marker-start: url(#arrowStart); marker-end: url(#arrow); }
      .single { fill: none; stroke: #40556d; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="980" rx="28" fill="url(#bg)"/>
  <text x="800" y="76" text-anchor="middle" class="title">Arquitetura e hospedagem — fluxo lógico</text>
  <text x="800" y="112" text-anchor="middle" class="subtitle">Visão simplificada das camadas e integrações identificadas no projeto</text>

  <g filter="url(#shadow)">
    <rect class="node" x="80" y="315" width="345" height="260" rx="26" fill="#fff"/>
    <text x="252" y="365" text-anchor="middle" class="heading">Navegador</text>
    <text x="252" y="411" text-anchor="middle" class="body">Interface da plataforma</text>
    <text x="252" y="449" text-anchor="middle" class="small">HTML · CSS · JavaScript</text>
    <text x="252" y="500" text-anchor="middle" class="small">Solicitações e respostas HTTP</text>
  </g>

  <rect x="505" y="205" width="600" height="485" rx="32" fill="#ffffff" fill-opacity=".48" stroke="#829bb4" stroke-width="2.5" stroke-dasharray="11 9"/>
  <text x="805" y="247" text-anchor="middle" class="label">CAMADA DE EXECUÇÃO / HOSPEDAGEM</text>
  <text x="805" y="276" text-anchor="middle" class="small">Configurações de implantação presentes no repositório</text>
  <g filter="url(#shadow)">
    <rect class="node" x="565" y="330" width="480" height="260" rx="26" fill="url(#app)"/>
    <text x="805" y="383" text-anchor="middle" class="heading">Aplicação PHP</text>
    <text x="805" y="430" text-anchor="middle" class="body">Páginas e endpoints</text>
    <text x="805" y="468" text-anchor="middle" class="small">Validação · autenticação · regras de negócio</text>
    <text x="805" y="518" text-anchor="middle" class="small">Acesso ao banco via mysqli</text>
    <text x="805" y="556" text-anchor="middle" class="small">Runtime configurado para Vercel</text>
  </g>
  <text x="805" y="646" text-anchor="middle" class="small">O repositório também contém Docker com Apache;</text>
  <text x="805" y="670" text-anchor="middle" class="small">a configuração não comprova, por si só, hospedagem ativa.</text>

  <g filter="url(#shadow)">
    <rect class="node" x="1190" y="250" width="335" height="230" rx="26" fill="url(#data)"/>
    <text x="1357" y="300" text-anchor="middle" class="heading">Banco de dados</text>
    <text x="1357" y="348" text-anchor="middle" class="body">TiDB Serverless</text>
    <text x="1357" y="386" text-anchor="middle" class="small">Compatível com MySQL</text>
    <text x="1357" y="424" text-anchor="middle" class="small">Persistência de dados do sistema</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="node" x="1190" y="555" width="335" height="295" rx="26" fill="url(#services)"/>
    <text x="1357" y="603" text-anchor="middle" class="heading">Serviços externos</text>
    <text x="1357" y="649" text-anchor="middle" class="body">Supabase Auth</text>
    <text x="1357" y="688" text-anchor="middle" class="body">Backblaze B2</text>
    <text x="1357" y="727" text-anchor="middle" class="body">Resend · Cloudflare Turnstile</text>
    <text x="1357" y="781" text-anchor="middle" class="small">Usados quando aplicável e configurados</text>
    <text x="1357" y="809" text-anchor="middle" class="small">por variáveis de ambiente.</text>
  </g>

  <path class="connector" d="M425 445 H565"/>
  <text x="495" y="425" text-anchor="middle" class="label">requisições</text>
  <path class="connector" d="M1045 390 H1190"/>
  <text x="1117" y="370" text-anchor="middle" class="label">consultas</text>
  <path class="connector" d="M1045 545 C1100 545 1124 615 1190 640"/>
  <text x="1102" y="584" text-anchor="middle" class="label">integrações</text>

  <rect x="80" y="895" width="1445" height="2" rx="1" fill="#c8d5e2"/>
  <text x="800" y="933" text-anchor="middle" class="small">Diagrama esquemático: representa o fluxo e as integrações no código, não um atestado de disponibilidade operacional.</text>
</svg>
