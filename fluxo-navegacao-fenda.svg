  <text class="box-note" x="1254" y="579">preferências do usuário</text>
  <rect class="box-purple" x="1380" y="525" width="225" height="70"/>
  <text class="box-title" x="1492" y="550">Central — abas</text>
  <text class="box-note" x="1492" y="579">conteúdo e gestão da conta</text>
  <rect class="box-purple" x="1152" y="615" width="453" height="88"/>
  <text class="box-title" x="1378" y="641">Posts · Comunidades · Depoimentos</text>
  <text class="box-title" x="1378" y="664">Notificações</text>
  <text class="box-note" x="1378" y="688">Solicitações · Sessões · Favoritos* · Marketplace*</text>
  <path class="line" d="M1357 465 H1370"/>
  <path class="line" d="M1357 555 H1370"/>
  <path class="line" d="M1492 585 V605"/>

  <rect class="group" x="60" y="770" width="1580" height="245"/>
  <text class="group-title" x="82" y="803">6. Utilidades e páginas institucionais</text>
  <rect class="box" x="145" y="845" width="300" height="80"/>
  <text class="box-title" x="295" y="875">Achados &amp; Perdidos</text>
  <text class="box-note" x="295" y="903">consulta por categoria</text>
  <rect class="box" x="680" y="845" width="300" height="80"/>
  <text class="box-title" x="830" y="875">Classificados</text>
  <text class="box-note" x="830" y="903">área utilitária</text>
  <rect class="box" x="1215" y="845" width="300" height="80"/>
  <text class="box-title" x="1365" y="875">Quem Somos / Diretrizes</text>
  <text class="box-note" x="1365" y="903">páginas institucionais</text>
  <text class="box-note" x="850" y="965">Achados e perdidos também classifica publicações do feed como “achei” ou “perdi”.</text>

  <text class="subtitle" x="62" y="1065">Legenda: setas sólidas = navegação principal observada no menu/áreas da aplicação.</text>
  <text class="subtitle" x="62" y="1094">* Abas visíveis com implementação incompleta/em desenvolvimento no código observado.</text>
</svg>
