  <rect class="box" x="92" y="435" width="205" height="70"/>
  <text class="box-title" x="194" y="460">Lista de comunidades</text>
  <text class="box-note" x="194" y="485">buscar / descobrir</text>
  <rect class="box" x="320" y="435" width="200" height="70"/>
