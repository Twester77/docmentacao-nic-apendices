  <rect class="box-amber" x="622" y="435" width="200" height="60"/>
  <text class="box-title" x="722" y="460">Lista / modo grid</text>
  <text class="box-note" x="722" y="485">eventos disponíveis</text>
  <rect class="box-amber" x="850" y="435" width="200" height="70"/>
  <text class="box-title" x="950" y="460">Detalhes do</text>
  <text class="box-title" x="950" y="482">evento</text>
  <rect class="box-amber" x="622" y="525" width="200" height="60"/>
  <text class="box-title" x="722" y="550">Responder / comentar</text>
  <text class="box-note" x="722" y="579">interação com o evento</text>
  <rect class="box-amber" x="850" y="525" width="200" height="70"/>
  <text class="box-title" x="950" y="550">Criar / editar</text>
  <text class="box-title" x="950" y="572">evento</text>
  <rect class="box-amber" x="622" y="615" width="428" height="60"/>
  <text class="box-title" x="836" y="640">Cancelar evento</text>
  <text class="box-note" x="836" y="660">fluxo de gestão do evento</text>
  <path class="line" d="M822 465 H840"/>
  <path class="line" d="M950 495 C950 510 722 510 722 515"/>
  <path class="line" d="M950 495 V515"/>
  <path class="line" d="M950 585 V605"/>

