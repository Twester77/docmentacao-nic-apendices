  <text class="box-note" x="194" y="669">ou editar se autorizado</text>
  <rect class="box" x="320" y="615" width="200" height="70"/>
  <text class="box-title" x="420" y="640">Eventos da</text>
  <text class="box-title" x="420" y="662">comunidade</text>
