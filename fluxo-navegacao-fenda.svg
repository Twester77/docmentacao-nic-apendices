<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1180" viewBox="0 0 1700 1180" style="width:100%;height:auto;display:block" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de navegação da plataforma A Fenda</title>
  <desc id="desc">Mapa de navegação da Fenda desde a entrada até feed, comunidades, eventos, utilidades, perfil, central do habitante e páginas institucionais.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .page { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 18; }
      .title { font-size: 36px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #475569; }
      .group { fill: #eff6ff; stroke: #64748b; stroke-width: 2; rx: 16; }
      .group-green { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 16; }
      .group-amber { fill: #fffbeb; stroke: #d97706; stroke-width: 2; rx: 16; }
      .group-purple { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; rx: 16; }
      .group-title { font-size: 23px; font-weight: 700; }
      .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 10; }
      .box-green { fill: #ffffff; stroke: #059669; stroke-width: 2; rx: 10; }
      .box-amber { fill: #ffffff; stroke: #d97706; stroke-width: 2; rx: 10; }
      .box-purple { fill: #ffffff; stroke: #7c3aed; stroke-width: 2; rx: 10; }
      .box-title { font-size: 18px; font-weight: 700; text-anchor: middle; }
      .box-note { font-size: 14px; fill: #475569; text-anchor: middle; }
      .line { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .line-dash { fill: none; stroke: #7c3aed; stroke-width: 2.5; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1700" height="1180" fill="#e2e8f0"/>
  <rect class="page" x="24" y="22" width="1652" height="1136"/>
  <text class="title" x="58" y="66">Fluxo de navegação da plataforma A Fenda</text>
  <text class="subtitle" x="58" y="94">Principais áreas e caminhos de navegação identificados na aplicação.</text>

  <rect class="group" x="60" y="125" width="300" height="210"/>
  <text class="group-title" x="82" y="158">1. Entrada</text>
  <rect class="box" x="95" y="180" width="230" height="52"/>
  <text class="box-title" x="210" y="212">Início / Entrar</text>
  <rect class="box" x="95" y="250" width="230" height="62"/>
  <text class="box-title" x="210" y="276">Cadastro / ativação</text>
  <text class="box-note" x="210" y="299">da conta</text>

  <rect class="group-green" x="425" y="125" width="1215" height="210"/>
  <text class="group-title" x="450" y="158">2. Área autenticada — Feed Geral</text>
  <rect class="box-green" x="465" y="188" width="230" height="80"/>
  <text class="box-title" x="580" y="220">Feed</text>
  <text class="box-note" x="580" y="243">publicações e filtros</text>
  <rect class="box-green" x="755" y="180" width="245" height="68"/>
  <text class="box-title" x="877" y="207">Criar publicação</text>
  <text class="box-note" x="877" y="231">texto / mídia / categoria</text>
  <rect class="box-green" x="755" y="258" width="245" height="55"/>
  <text class="box-title" x="877" y="282">Comentários e reações</text>
  <text class="box-note" x="877" y="301">abrir a conversa da publicação</text>
  <rect class="box-green" x="1065" y="180" width="245" height="68"/>
  <text class="box-title" x="1187" y="207">Categorias / comunidades</text>
  <text class="box-note" x="1187" y="231">filtros do feed</text>
  <rect class="box-green" x="1065" y="258" width="245" height="55"/>
  <text class="box-title" x="1187" y="282">Achados e perdidos</text>
  <text class="box-note" x="1187" y="301">posts do feed: “achei” / “perdi”</text>
  <rect class="box-green" x="1360" y="210" width="235" height="76"/>
  <text class="box-title" x="1477" y="239">Perfil público</text>
  <text class="box-note" x="1477" y="265">do autor da publicação</text>

